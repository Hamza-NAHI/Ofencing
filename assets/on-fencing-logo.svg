<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216" fill="#191e22" role="img" aria-labelledby="on-title on-desc">
  <title id="on-title">ON — Épée fencing</title>
  <desc id="on-desc">ON pierced through its centre by a sporting épée with French grip, deep bell guard and rounded electric tip. Transparent background.</desc>
  <defs>
    <!-- Transparent clearance, not white paint. -->
    <clipPath id="on-blade-clearance">
      <path d="M0 0H720V102H0ZM0 114H720V216H0Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#on-blade-clearance)">
    <path fill-rule="evenodd" d="M215 25H278C326 25 360 60 360 108S326 191 278 191H215C167 191 134 156 134 108S167 25 215 25ZM214 75C195 75 184 88 184 108S195 141 214 141H279C298 141 310 128 310 108S298 75 279 75Z"/>
    <path d="M380 25H404Q410 25 416 30L533 126V35Q533 25 543 25H586V191H548Q542 191 536 186L423 91V191H371V35Q371 25 380 25Z"/>
  </g>
  <!-- French grip and pommel behind the guard. -->
  <path d="M35 102H76Q81 102 86 99L90 101V115L86 117Q81 114 76 114H35Q28 114 28 108T35 102Z"/>
  <!-- Deep bell: open toward the hand, convex toward the blade. -->
